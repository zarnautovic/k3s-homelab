# General cluster settings
cluster_name: homelab-k3s

k3s_version: v1.34.2+k3s1
k3s_token: "#generate a random string and keep it private"
k3s_vip: "192.168.1.xxx" # the IP address of the virtual IP for the Kubernetes API

# K3s networking
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Cilium settings
cilium_version: "1.18.4"
cilium_cluster_pod_cidr: "{{ k3s_cluster_cidr }}"
cilium_lb_pool_cidr: "192.168.1.xxx/29" # the CIDR range for the Kubernetes Load Balancer pool
cilium_iface: "eth0" # the network interface to use for the Cilium network

# Kube-VIP settings
kube_vip_version: v0.8.0

# OS tuning
timezone: "Europe/Zagreb"
